name: Generate Daily Fantasy Points

on:
  schedule:
    - cron: '0 2 * * 1' # Runs at 2:00 AM UTC every Monday
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 streamlit

      - name: Run Collector
        run: python src/collector.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.csv
          git commit -m "Automated daily point collection" || exit 0
          git push
